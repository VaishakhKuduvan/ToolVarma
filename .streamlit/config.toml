[server]
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Shared type and shape. Colours are set per light / dark theme below;
# the app follows the viewer's system setting.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap"
headingFontWeights = [700, 600, 600, 600]
headingFontSizes = ["2.25rem", "1.6rem", "1.25rem", "1.05rem"]
baseFontSize = 15
baseRadius = "0.5rem"
showWidgetBorder = true
metricValueFontSize = "1.6rem"

# Palette: Midnight Navy #101C2C, Navy #1F3548, Teal #0F8B8D, Mist #F4F6F8, White #FFFFFF.
# Buttons and links use a deeper teal (#0B7476) so white text meets WCAG AA contrast (5.6:1);
# on dark backgrounds links use a lighter teal (#3FB8BA, 7.2:1).
[theme.light]
primaryColor = "#0B7476"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#101C2C"
linkColor = "#0B7476"
borderColor = "#DDE3EA"
# Status badges use the "blue" slot, tinted teal to match the palette
blueColor = "#0F8B8D"
blueBackgroundColor = "#E3F3F3"
blueTextColor = "#0B6466"

[theme.light.sidebar]
primaryColor = "#3FB8BA"
backgroundColor = "#101C2C"
secondaryBackgroundColor = "#1F3548"
textColor = "#F4F6F8"
linkColor = "#3FB8BA"
borderColor = "#1F3548"

[theme.dark]
primaryColor = "#0B7476"
backgroundColor = "#101C2C"
secondaryBackgroundColor = "#1F3548"
textColor = "#F4F6F8"
linkColor = "#3FB8BA"
borderColor = "#2A4258"
blueColor = "#3FB8BA"
blueBackgroundColor = "#123A42"
blueTextColor = "#5FC4C6"

[theme.dark.sidebar]
primaryColor = "#3FB8BA"
backgroundColor = "#1F3548"
secondaryBackgroundColor = "#101C2C"
textColor = "#F4F6F8"
linkColor = "#3FB8BA"
borderColor = "#2A4258"
